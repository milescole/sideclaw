[project]
name = "sideclaw"
version = "0.1.0"
description = "Lightweight AI assistant framework"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "fal-client>=0.9.0",
    "litellm>=1.60.0",
    "playwright>=1.49.0",
    "httpx>=0.28.0",
    "loguru>=0.7.3",
    "rich>=14.0.0",
    "python-telegram-bot>=21.0",
    "json-repair>=0.30.0",
    "jsonschema>=4.0",
    "croniter>=6.0.0",
    "anthropic>=0.43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0",
]

[project.scripts]
sideclaw = "sideclaw.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN", # flake8-annotations defer strict typing coverage
    "D", # pydocstyle defer docstring coverage
    "S101", # assert expected in tests
    "PLC0415", # import-outside-top-level allow intentional lazy imports
    "PLR2004", # magic-value-comparison low priority style
    "COM812", # missing-trailing-comma handled by formatter
    "ARG001", # unused-function-argument framework callbacks
    "ARG002", # unused-method-argument framework callbacks
    "FURB110", # if-exp-instead-of-or-operator style preference
    "PERF401", # manual-list-comprehension micro-optimization
    "SIM105", # suppressible-exception style-level simplification
    "SIM108", # if-else-block-instead-of-if-exp style-level simplification
    "SIM117", # multiple-with-statements style-level simplification
    "RSE102", # unnecessary-paren-on-raise-exception style-level
    "EM102", # f-string-in-exception style-level
    "TRY003", # raise-vanilla-args style-level
    "C901", # complexity thresholds are too aggressive for current command/runtime surfaces
    "FBT001", # boolean positional parameters are accepted in the current API shape
    "FBT003", # boolean positional arguments are accepted in the current API shape
    "PLR0912", # branch count thresholds are too aggressive for current CLI flows
    "PLR0913", # argument count thresholds are too aggressive for current runtime interfaces
    "PLR0915", # statement count thresholds are too aggressive for current command/runtime surfaces
    "PLW0603", # module-level approval config intentionally uses global state
    "SLF001", # selected internal access is intentional at integration boundaries
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S105", # hardcoded-password-string test fixtures use fake secrets
    "S106", # hardcoded-password-func-arg test fixtures use fake secrets
    "ASYNC240", # tests may use pathlib helpers for fixture assertions
    "SLF001", # private-member-access tests may inspect internals
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
